<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Sederhana</title>
    <!-- Memuat Tailwind CSS untuk styling responsif dan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat font Inter dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen antialiased selection:bg-indigo-100 selection:text-indigo-700">

    <!-- Kontainer Utama -->
    <div class="max-w-xl mx-auto w-full px-4 py-8 sm:py-12">

        <!-- Header & Progress Bar -->
        <header class="mb-6">
            <div class="flex items-center justify-between gap-4 mb-2">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Daftar Tugas</h1>
                    <p id="current-date" class="text-sm text-slate-500 mt-1"></p>
                </div>
                <div class="text-right">
                    <span id="progress-text" class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full">
                        0% Selesai
                    </span>
                </div>
            </div>
            <!-- Indikator Progress -->
            <div class="w-full bg-slate-200 rounded-full h-2 mt-4 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
            </div>
        </header>

        <!-- Kartu Utama Aplikasi -->
        <main class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-6">

            <!-- Form Tambah Tugas -->
            <form id="todo-form" class="flex flex-col sm:flex-row gap-2.5 mb-6">
                <div class="flex-1 flex gap-2">
                    <input
                        type="text"
                        id="todo-input"
                        placeholder="Tulis tugas baru di sini..."
                        autocomplete="off"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm sm:text-base text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 focus:bg-white transition-all"
                    >
                    <select
                        id="todo-priority"
                        aria-label="Pilih Prioritas"
                        class="px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm font-medium text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 cursor-pointer transition-all"
                    >
                        <option value="normal">Normal</option>
                        <option value="penting">Penting</option>
                        <option value="mendesak">Mendesak</option>
                    </select>
                </div>
                <button
                    type="submit"
                    class="w-full sm:w-auto px-5 py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-medium text-sm sm:text-base rounded-xl shadow-sm shadow-indigo-200 transition-all flex items-center justify-center gap-2 cursor-pointer"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                    <span>Tambah</span>
                </button>
            </form>

            <!-- Bar Filter & Statistik -->
            <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-100">
                <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl" role="tablist">
                    <button type="button" data-filter="all" class="filter-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all bg-white text-slate-900 shadow-sm">
                        Semua
                    </button>
                    <button type="button" data-filter="active" class="filter-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-slate-600 hover:text-slate-900">
                        Aktif
                    </button>
                    <button type="button" data-filter="completed" class="filter-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-slate-600 hover:text-slate-900">
                        Selesai
                    </button>
                </div>

                <button
                    type="button"
                    id="clear-completed-btn"
                    class="hidden text-xs sm:text-sm font-medium text-rose-600 hover:text-rose-700 hover:bg-rose-50 px-3 py-1.5 rounded-lg transition-all cursor-pointer"
                >
                    Hapus yang Selesai
                </button>
            </div>

            <!-- Daftar Tugas -->
            <ul id="todo-list" class="space-y-2.5">
                <!-- Item tugas akan dirender secara dinamis oleh JavaScript -->
            </ul>

            <!-- Tampilan Kosong (Empty State) -->
            <div id="empty-state" class="hidden py-12 text-center">
                <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                </div>
                <p id="empty-title" class="text-slate-700 font-medium text-base">Belum ada tugas</p>
                <p id="empty-subtitle" class="text-slate-400 text-sm mt-1">Tambahkan tugas pertamamu di atas untuk mulai produktif.</p>
            </div>

            <!-- Footer Ringkasan -->
            <footer class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs sm:text-sm text-slate-500">
                <span id="items-left">0 tugas tersisa</span>
                <span class="text-slate-400">Tersimpan otomatis di browser</span>
            </footer>
        </main>
    </div>

    <!-- Notifikasi Toast (pengganti alert) -->
    <div id="toast-container" class="fixed bottom-5 right-5 left-5 sm:left-auto z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Modal Konfirmasi Kustom (pengganti confirm) -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-2">Hapus Tugas Selesai?</h2>
            <p class="text-sm text-slate-500 mb-6">Semua tugas yang sudah ditandai selesai akan dihapus secara permanen dari daftar ini.</p>
            <div class="flex items-center justify-end gap-2.5">
                <button type="button" id="modal-cancel-btn" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition-all cursor-pointer">
                    Batal
                </button>
                <button type="button" id="modal-confirm-btn" class="px-4 py-2.5 rounded-xl text-sm font-medium bg-rose-600 hover:bg-rose-700 text-white shadow-sm transition-all cursor-pointer">
                    Ya, Hapus
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Aplikasi To-Do List Sederhana
         * Menyimpan data secara lokal menggunakan localStorage browser.
         */

        // Kunci penyimpanan di localStorage
        const STORAGE_KEY = 'webapp_todolist_data_v1';

        // State aplikasi
        let todos = [];
        let currentFilter = 'all'; // 'all' | 'active' | 'completed'
        let editingId = null;

        // Referensi Elemen DOM
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoPriority = document.getElementById('todo-priority');
        const todoList = document.getElementById('todo-list');
        const emptyState = document.getElementById('empty-state');
        const emptyTitle = document.getElementById('empty-title');
        const emptySubtitle = document.getElementById('empty-subtitle');
        const itemsLeftEl = document.getElementById('items-left');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const clearCompletedBtn = document.getElementById('clear-completed-btn');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const currentDateEl = document.getElementById('current-date');
        const toastContainer = document.getElementById('toast-container');

        // Referensi Modal Konfirmasi
        const confirmModal = document.getElementById('confirm-modal');
        const modalCancelBtn = document.getElementById('modal-cancel-btn');
        const modalConfirmBtn = document.getElementById('modal-confirm-btn');

        /**
         * Menampilkan tanggal hari ini dalam format Bahasa Indonesia
         */
        function renderCurrentDate() {
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            const today = new Date();
            currentDateEl.textContent = today.toLocaleDateString('id-ID', options);
        }

        /**
         * Memuat daftar tugas dari localStorage dengan penanganan error
         */
        function loadTodos() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        todos = parsed;
                    }
                }
            } catch (error) {
                console.error('Gagal memuat data dari localStorage:', error);
                todos = [];
            }
        }

        /**
         * Menyimpan daftar tugas ke localStorage
         */
        function saveTodos() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
            } catch (error) {
                console.error('Gagal menyimpan data ke localStorage:', error);
                showToast('Gagal menyimpan data secara lokal.', 'error');
            }
        }

        /**
         * Menampilkan notifikasi toast singkat di pojok bawah
         */
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colorClass = type === 'error'
                ? 'bg-rose-600 text-white'
                : 'bg-slate-900 text-white';

            toast.className = `${colorClass} px-4 py-3 rounded-xl shadow-lg text-sm font-medium pointer-events-auto transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.textContent = message;
            toastContainer.appendChild(toast);

            // Animasi masuk
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            // Hapus otomatis setelah 2.5 detik
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        /**
         * Mengembalikan kelas badge Tailwind sesuai tingkat prioritas
         */
        function getPriorityBadge(priority) {
            switch (priority) {
                case 'mendesak':
                    return { label: 'Mendesak', classes: 'bg-rose-50 text-rose-700 border border-rose-200/80' };
                case 'penting':
                    return { label: 'Penting', classes: 'bg-amber-50 text-amber-700 border border-amber-200/80' };
                default:
                    return { label: 'Normal', classes: 'bg-slate-100 text-slate-600 border border-slate-200/80' };
            }
        }

        /**
         * Mencegah serangan XSS saat menampilkan teks input pengguna
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /**
         * Memperbarui tampilan daftar tugas, progress bar, dan statistik
         */
        function renderTodos() {
            // Filter tugas sesuai tab yang dipilih
            const filteredTodos = todos.filter(todo => {
                if (currentFilter === 'active') return !todo.completed;
                if (currentFilter === 'completed') return todo.completed;
                return true;
            });

            // Hitung statistik
            const totalCount = todos.length;
            const completedCount = todos.filter(t => t.completed).length;
            const activeCount = totalCount - completedCount;
            const percentage = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);

            // Perbarui header progress & footer
            progressText.textContent = `${percentage}% Selesai`;
            progressBar.style.width = `${percentage}%`;
            itemsLeftEl.textContent = `${activeCount} tugas tersisa`;

            // Tampilkan/sembunyikan tombol hapus selesai
            if (completedCount > 0) {
                clearCompletedBtn.classList.remove('hidden');
            } else {
                clearCompletedBtn.classList.add('hidden');
            }

            // Kosongkan list sebelum render ulang
            todoList.innerHTML = '';

            // Tampilkan empty state jika tidak ada item
            if (filteredTodos.length === 0) {
                emptyState.classList.remove('hidden');
                if (totalCount === 0) {
                    emptyTitle.textContent = 'Belum ada tugas';
                    emptySubtitle.textContent = 'Tambahkan tugas pertamamu di atas untuk mulai produktif.';
                } else if (currentFilter === 'active') {
                    emptyTitle.textContent = 'Semua tugas sudah selesai!';
                    emptySubtitle.textContent = 'Kerja bagus, tidak ada tugas aktif yang tersisa.';
                } else {
                    emptyTitle.textContent = 'Belum ada tugas yang selesai';
                    emptySubtitle.textContent = 'Centang tugas yang sudah kamu kerjakan.';
                }
                return;
            }

            emptyState.classList.add('hidden');

            // Render tiap item tugas
            filteredTodos.forEach(todo => {
                const li = document.createElement('li');
                const isEditing = editingId === todo.id;
                const badge = getPriorityBadge(todo.priority);

                li.className = `group flex items-center gap-3 p-3 sm:p-3.5 rounded-xl border transition-all ${
                    todo.completed
                        ? 'bg-slate-50/70 border-slate-100'
                        : 'bg-white border-slate-200/80 hover:border-indigo-200 hover:shadow-xs'
                }`;

                if (isEditing) {
                    // Mode Edit Inline
                    li.innerHTML = `
                        <input
                            type="text"
                            id="edit-input-${todo.id}"
                            value="${escapeHtml(todo.text)}"
                            class="flex-1 px-3 py-1.5 bg-slate-50 border border-indigo-400 rounded-lg text-sm sm:text-base text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/30"
                        >
                        <div class="flex items-center gap-1.5">
                            <button type="button" onclick="saveEdit('${todo.id}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg transition-all cursor-pointer">
                                Simpan
                            </button>
                            <button type="button" onclick="cancelEdit()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium rounded-lg transition-all cursor-pointer">
                                Batal
                            </button>
                        </div>
                    `;
                } else {
                    // Mode Tampilan Normal
                    li.innerHTML = `
                        <button
                            type="button"
                            onclick="toggleTodo('${todo.id}')"
                            aria-label="${todo.completed ? 'Tandai belum selesai' : 'Tandai selesai'}"
                            class="shrink-0 w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all cursor-pointer ${
                                todo.completed
                                    ? 'bg-indigo-600 border-indigo-600 text-white'
                                    : 'border-slate-300 hover:border-indigo-500 bg-white'
                            }"
                        >
                            ${todo.completed ? `
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                                </svg>
                            ` : ''}
                        </button>

                        <div class="flex-1 min-w-0 flex flex-wrap items-center gap-2">
                            <span
                                onclick="toggleTodo('${todo.id}')"
                                class="text-sm sm:text-base break-words cursor-pointer transition-all ${
                                    todo.completed ? 'line-through text-slate-400' : 'text-slate-800 font-medium'
                                }"
                            >
                                ${escapeHtml(todo.text)}
                            </span>
                            <span class="text-[11px] font-medium px-2 py-0.5 rounded-md ${badge.classes} ${todo.completed ? 'opacity-50' : ''}">
                                ${badge.label}
                            </span>
                        </div>

                        <div class="flex items-center gap-1 shrink-0 sm:opacity-0 sm:group-hover:opacity-100 focus-within:opacity-100 transition-opacity">
                            <button
                                type="button"
                                onclick="startEdit('${todo.id}')"
                                aria-label="Edit tugas"
                                class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all cursor-pointer"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                </svg>
                            </button>
                            <button
                                type="button"
                                onclick="deleteTodo('${todo.id}')"
                                aria-label="Hapus tugas"
                                class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all cursor-pointer"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    `;
                }

                todoList.appendChild(li);

                // Fokus otomatis pada input saat masuk mode edit
                if (isEditing) {
                    const editInput = document.getElementById(`edit-input-${todo.id}`);
                    if (editInput) {
                        editInput.focus();
                        editInput.setSelectionRange(editInput.value.length, editInput.value.length);
                        editInput.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') saveEdit(todo.id);
                            if (e.key === 'Escape') cancelEdit();
                        });
                    }
                }
            });
        }

        /**
         * Menambah tugas baru ke dalam daftar
         */
        function addTodo(text, priority) {
            const trimmed = text.trim();
            if (!trimmed) {
                showToast('Tulis nama tugas terlebih dahulu.', 'error');
                todoInput.focus();
                return;
            }

            const newTodo = {
                id: Date.now().toString(36) + Math.random().toString(36).substring(2, 6),
                text: trimmed,
                priority: priority || 'normal',
                completed: false,
                createdAt: new Date().toISOString()
            };

            todos.unshift(newTodo);
            saveTodos();
            renderTodos();
            todoInput.value = '';
            todoPriority.value = 'normal';
            todoInput.focus();
            showToast('Tugas berhasil ditambahkan.');
        }

        /**
         * Mengubah status selesai/belum selesai pada tugas
         */
        window.toggleTodo = function(id) {
            todos = todos.map(todo =>
                todo.id === id ? { ...todo, completed: !todo.completed } : todo
            );
            saveTodos();
            renderTodos();
        };

        /**
         * Menghapus satu tugas berdasarkan ID
         */
        window.deleteTodo = function(id) {
            todos = todos.filter(todo => todo.id !== id);
            if (editingId === id) editingId = null;
            saveTodos();
            renderTodos();
            showToast('Tugas dihapus.');
        };

        /**
         * Masuk ke mode edit untuk satu tugas
         */
        window.startEdit = function(id) {
            editingId = id;
            renderTodos();
        };

        /**
         * Menyimpan perubahan hasil edit tugas
         */
        window.saveEdit = function(id) {
            const editInput = document.getElementById(`edit-input-${id}`);
            if (!editInput) return;

            const newText = editInput.value.trim();
            if (!newText) {
                showToast('Nama tugas tidak boleh kosong.', 'error');
                editInput.focus();
                return;
            }

            todos = todos.map(todo =>
                todo.id === id ? { ...todo, text: newText } : todo
            );
            editingId = null;
            saveTodos();
            renderTodos();
            showToast('Tugas diperbarui.');
        };

        /**
         * Membatalkan mode edit
         */
        window.cancelEdit = function() {
            editingId = null;
            renderTodos();
        };

        // Event Listener: Submit Form Tambah Tugas
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            addTodo(todoInput.value, todoPriority.value);
        });

        // Event Listener: Tombol Filter (Semua / Aktif / Selesai)
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                currentFilter = btn.dataset.filter;

                filterBtns.forEach(b => {
                    b.classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
                    b.classList.add('text-slate-600');
                });

                btn.classList.add('bg-white', 'text-slate-900', 'shadow-sm');
                btn.classList.remove('text-slate-600');

                renderTodos();
            });
        });

        // Event Listener: Buka Modal Konfirmasi Hapus Selesai
        clearCompletedBtn.addEventListener('click', () => {
            confirmModal.classList.remove('hidden');
        });

        // Event Listener: Tutup Modal
        modalCancelBtn.addEventListener('click', () => {
            confirmModal.classList.add('hidden');
        });

        // Tutup modal jika klik di area luar kotak dialog
        confirmModal.addEventListener('click', (e) => {
            if (e.target === confirmModal) {
                confirmModal.classList.add('hidden');
            }
        });

        // Event Listener: Eksekusi Hapus Semua Tugas Selesai
        modalConfirmBtn.addEventListener('click', () => {
            todos = todos.filter(todo => !todo.completed);
            saveTodos();
            renderTodos();
            confirmModal.classList.add('hidden');
            showToast('Semua tugas selesai telah dihapus.');
        });

        // Inisialisasi aplikasi saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            renderCurrentDate();
            loadTodos();
            renderTodos();
        });
    </script>
</body>
</html>
